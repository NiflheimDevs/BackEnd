<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Invitation Accepted</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #333333;
            font-size: 24px;
        }

        p {
            font-size: 16px;
            color: #555555;
            line-height: 1.6;
        }

        .highlight {
            font-weight: bold;
            color: #2c3e50;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999999;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Invitation Accepted 🎉</h1>
        <p>Hi <strong>{{.InviterUsername}}</strong>,</p>
        <p><span class="highlight">{{.InviteeUsername}}</span> has accepted your invitation to join the team <span
                class="highlight">{{.TeamName}}</span>.</p>
        <p>You can now collaborate with them inside your team workspace.</p>
        <p>Thanks for growing your team with us!</p>
        <div class="footer">
            This is an automated message – no need to reply.
        </div>
    </div>
</body>

</html>
