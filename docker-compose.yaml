services:
  db:
    image: postgres:17
    container_name: postgres_container
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_USER: niflheim
      POSTGRES_PASSWORD: niflguard
      POSTGRES_DB: bidlancer
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  redis:
      image: redis:latest
      container_name: redis_container
      restart: always
      privileged: true
      ports:
        - "6379:6379"
      volumes:
        - redisdata:/data
      sysctls:
        - vm.overcommit_memory=1
      command: >
        sh -c "sysctl -w vm.overcommit_memory=1 && redis-server --save 60 1 --loglevel warning"

  app:
    build: .
    image: ghcr.io/niflheimdevs/backend
    container_name: application
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      ./.env
    ports:
      - "8080:8080"
    links:
      - db
      - redis

volumes:
  pgdata:
  redisdata:
