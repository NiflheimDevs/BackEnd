<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>پذیرش دعوت</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html {
            height: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top left, #ffdee9, #b5fffc);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            padding: 40px 30px;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .logo {
            max-width: 150px;
            margin: 0 auto 30px;
        }

        h1 {
            font-size: 30px;
            color: #d81b60;
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            color: #444;
            margin: 12px 0;
        }

        .highlight {
            font-weight: bold;
            color: #2c3e50;
        }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="../../../../Downloads/BIDLANCERLOGO.svg" alt="Bidlancer Logo" class="logo">
        <h1>پذیرش دعوت 🎉</h1>
        <p>سلام <strong>{{.InviterUsername}}</strong> عزیز،</p>
        <p>کاربر <span class="highlight">{{.InviteeUsername}}</span> دعوت شما برای پیوستن به تیم
            <span class="highlight">{{.TeamName}}</span> را پذیرفته است.</p>
        <p>اکنون می‌توانید با یکدیگر در محیط تیم همکاری کنید.</p>
        <p>از اینکه تیم خود را با ما رشد می‌دهید متشکریم!</p>
        <div class="footer">
            این پیام به صورت خودکار ارسال شده است – نیازی به پاسخ نیست.
        </div>
    </div>
</body>

</html>
