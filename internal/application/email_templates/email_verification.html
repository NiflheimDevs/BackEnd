<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تأیید ایمیل</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
    html {
        height: 100%;
    }

    body {
        font-family: 'Vazirmatn', sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #ffdee9, #b5fffc);
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    .container {
        max-width: 700px;
        margin: 80px auto;
        padding: 40px 30px;
        background-color: #ffffff;
        border-radius: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        text-align: center;
    }

    .logo {
        max-width: 150px;
        margin: 0 auto 30px;
    }

    h1 {
        font-size: 30px;
        color: #d81b60;
        margin-bottom: 20px;
    }

    p {
        font-size: 17px;
        color: #444;
        margin: 12px 0;
    }

    .button {
        display: inline-block;
        margin-top: 25px;
        padding: 14px 28px;
        background: linear-gradient(to right, #43cea2, #185a9d);
        color: white;
        text-decoration: none;
        font-weight: bold;
        border-radius: 10px;
        font-size: 16px;
        box-shadow: 0 5px 15px rgba(24, 90, 157, 0.5);
    }

    .button:hover {
        opacity: 0.9;
    }

    .url-box {
        margin-top: 20px;
        padding: 10px;
        background-color: #f4f4f4;
        border-radius: 6px;
        direction: ltr;
        font-family: monospace;
        font-size: 13px;
        color: #000;
    }

    .footer {
        margin-top: 40px;
        font-size: 13px;
        color: #888;
    }
</style>

</head>


<body>
    <div class="container">
        <img src="../../../../Downloads/BIDLANCERLOGO.svg" alt="Bidlancer Logo" class="logo">
        <h1>تأیید ایمیل</h1>
        <p>سلام {{.Username}} عزیز،</p>
        <p>از ثبت‌نام شما در Bidlancer متشکریم</p>
        <p>برای فعال‌سازی حساب، لطفاً روی دکمه زیر کلیک کنید:</p>
        <a href="{{.VerificationURL}}" class="button">تأیید ایمیل</a>
        <p>اگر دکمه بالا عمل نمی‌کند، لینک زیر را در مرورگر باز کنید:</p>
        <div class="url-box">
            {{.VerificationURL}}
        </div>
        <div class="footer">
            اگر شما این حساب را ایجاد نکرده‌اید، نیازی به انجام کاری نیست.
        </div>
    </div>
</body>

</html>
